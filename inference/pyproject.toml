[project]
name = "tool-agent-lab-inference"
version = "0.1.0"
description = "Local CUDA inference environment for Tool Agent Lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "trainable-tool-agent-lab",
    "torch==2.9.1",
    "transformers==4.57.6",
    "peft==0.18.1",
    "accelerate==1.12.0",
    "bitsandbytes==0.49.2",
]

[tool.uv]
# Keep shared application dependencies aligned with the lightweight application lock.
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "click==8.5.0",
    "colorama==0.4.6",
    "cryptography==50.0.2",
    "fastapi==0.142.4",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "idna==3.20",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "mcp==1.30.0",
    "opentelemetry-api==1.45.1",
    "packaging==26.3",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "pywin32==312",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "sse-starlette==3.5.0",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.54.0",
]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
trainable-tool-agent-lab = { path = "..", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
